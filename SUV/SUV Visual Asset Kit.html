<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUV — Visual Asset Kit</title>
<style>
  :root{
    --bg:#0b0910;
    --panel:#15121f;
    --panel2:#1c192a;
    --line:#2a2538;
    --ink:#ece8f5;
    --dim:#9a92ad;
    --dim2:#5d5670;
    --purple:#6d4aff;
    --cyan:#00d9ff;
    --gold:#c9a227;
    --rust:#b5563f;
    --sage:#5f9070;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:
      radial-gradient(1000px 600px at 90% -10%, rgba(109,74,255,.18), transparent 60%),
      radial-gradient(800px 500px at 0% 120%, rgba(0,217,255,.12), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:40px 22px 90px}

  /* ---------- masthead ---------- */
  .masthead{border-bottom:1px solid var(--line);padding-bottom:26px;margin-bottom:38px}
  .eyebrow{
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--cyan);font-weight:700;margin-bottom:12px;
  }
  h1{margin:0 0 10px;font-size:clamp(28px,4.6vw,44px);line-height:1.1;letter-spacing:-.02em;font-weight:800}
  h1 em{font-style:normal;color:var(--purple)}
  .sub{color:var(--dim);max-width:66ch;margin:0;font-size:15.5px}

  h2{
    font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim2);
    font-weight:700;margin:52px 0 18px;display:flex;align-items:center;gap:14px;
  }
  h2::after{content:"";flex:1;height:1px;background:var(--line)}

  /* ---------- generic panel ---------- */
  .panel{
    background:linear-gradient(160deg,var(--panel),var(--panel2));
    border:1px solid var(--line);border-radius:var(--radius);padding:22px;
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}

  /* ---------- 9-post grid ---------- */
  .ig-shell{
    display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:26px;align-items:start;
  }
  @media(max-width:980px){.ig-shell{grid-template-columns:1fr}}

  .phone{
    background:#0b0910;border:1px solid var(--line);border-radius:24px;padding:14px;
    max-width:560px;
  }
  .phone-bar{
    display:flex;align-items:center;gap:10px;padding:2px 6px 14px;
    border-bottom:1px solid #262034;margin-bottom:12px;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim2)}
  .phone-handle{font-size:13px;font-weight:700;letter-spacing:.02em}
  .phone-meta{margin-left:auto;font-size:11px;color:var(--dim2);letter-spacing:.1em;text-transform:uppercase}

  .nine{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .tile{
    position:relative;aspect-ratio:1/1;overflow:hidden;cursor:pointer;
    background:linear-gradient(155deg,#221d33,#14101f);
    border:1px solid #2b2440;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:11px 10px;transition:transform .16s ease,border-color .16s ease;
  }
  .tile:hover{transform:translateY(-2px);border-color:var(--cyan);z-index:2}
  .tile.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .tile.hub{background:linear-gradient(155deg,#2e244a,#1a1428)}
  .tile-num{
    font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--dim2);
    display:flex;align-items:center;gap:6px;
  }
  .tile-txt{
    font-size:clamp(9.5px,1.35vw,12.5px);line-height:1.25;font-weight:650;letter-spacing:-.005em;
  }
  .tile-foot{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .chip{
    font-size:8.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
    padding:3px 6px;border-radius:999px;white-space:nowrap;
  }
  .chip.inc{background:rgba(95,144,112,.16);color:#8fc7a3;border:1px solid rgba(95,144,112,.45)}
  .chip.con{background:rgba(109,74,255,.16);color:#a894ff;border:1px solid rgba(109,74,255,.45)}
  .chip.dis{background:rgba(181,86,63,.16);color:#dd9077;border:1px solid rgba(181,86,63,.45)}
  .tile-bar{font-size:8.5px;color:var(--dim2);font-variant-numeric:tabular-nums;letter-spacing:.04em}

  .safe-overlay{position:absolute;inset:0;pointer-events:none;display:none}
  .nine.zones .safe-overlay{display:block}
  .safe-overlay::before{
    content:"";position:absolute;inset:0;border:1px dashed rgba(236,232,245,.32);
  }
  .safe-overlay::after{
    content:"1:1 SAFE";position:absolute;bottom:5px;left:7px;font-size:7.5px;
    letter-spacing:.14em;color:rgba(236,232,245,.42);font-weight:700;
  }

  .toggle{
    display:inline-flex;align-items:center;gap:9px;font-size:12px;color:var(--dim);
    cursor:pointer;user-select:none;margin-top:14px;
  }
  .sw{
    width:36px;height:20px;border-radius:999px;background:#2b2440;position:relative;
    transition:background .18s ease;flex:none;
  }
  .sw::after{
    content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
    background:var(--dim);transition:transform .18s ease,background .18s ease;
  }
  .toggle.on .sw{background:rgba(0,217,255,.5)}
  .toggle.on .sw::after{transform:translateX(16px);background:var(--cyan)}

  /* ---------- inspector ---------- */
  .inspector{position:sticky;top:22px}
  .insp-id{font-size:10px;letter-spacing:.2em;color:var(--gold);font-weight:800;text-transform:uppercase}
  .insp-line{font-size:19px;font-weight:750;line-height:1.3;margin:9px 0 14px;letter-spacing:-.01em}
  .kv{display:flex;gap:10px;font-size:12.5px;padding:7px 0;border-top:1px solid var(--line)}
  .kv b{color:var(--dim2);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:10px;min-width:78px;padding-top:2px}
  .kv span{color:var(--ink);flex:1}
  .wis{
    margin-top:14px;padding:13px 14px;border-left:2px solid var(--gold);
    background:rgba(201,162,39,.055);border-radius:0 8px 8px 0;
    font-size:13.5px;font-style:italic;color:#ddd5ea;
  }

  /* ---------- icon set ---------- */
  .icons{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px}
  .icon-card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;
    text-align:center;
  }
  .icon-card svg{display:block;margin:0 auto 11px}
  .icon-name{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}
  .icon-use{font-size:11.5px;color:var(--dim);line-height:1.45}
  .icon-sizes{font-size:9.5px;color:var(--dim2);margin-top:8px;letter-spacing:.08em;font-variant-numeric:tabular-nums}

  /* ---------- timeline ---------- */
  .tl-wrap{padding:22px 22px 62px;position:relative;overflow-x:auto}
  .tl{display:flex;min-width:640px;height:104px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .seg{
    position:relative;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;
    border-right:1px solid rgba(0,0,0,.45);transition:filter .15s ease;
  }
  .seg:last-child{border-right:none}
  .seg:hover{filter:brightness(1.45)}
  .seg.stab{background:linear-gradient(180deg,#2d2a48,#1a1628)}
  .seg.unacc{background:linear-gradient(180deg,#2a2438,#1c1526);opacity:.55}
  .seg em{
    position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:flex-start;
    justify-content:center;padding-top:7px;font-style:normal;font-size:8px;
    color:rgba(236,232,245,.4);letter-spacing:.06em;font-weight:700;
  }
  .ticks{position:relative;min-width:640px;height:26px;margin-top:6px}
  .tick{position:absolute;top:0;font-size:9.5px;color:var(--dim2);transform:translateX(-50%);font-variant-numeric:tabular-nums}
  .acts{display:flex;min-width:640px;margin-top:14px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .act{
    padding:9px 6px;text-align:center;font-size:9.5px;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;color:var(--dim);background:#191524;border-right:1px solid var(--line);
  }
  .act:last-child{border-right:none}

  /* ---------- wallpaper frames ---------- */
  .wall-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
  .wall{}
  .frame{
    border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;
    background:
      radial-gradient(circle at 68% 28%, rgba(0,217,255,.34), transparent 58%),
      linear-gradient(140deg,#2b2438,#15121f);
    display:flex;align-items:flex-end;
  }
  .frame.f169{aspect-ratio:16/9}
  .frame.f916{aspect-ratio:9/16}
  .frame.f11{aspect-ratio:1/1}
  .frame.fcover{aspect-ratio:851/315}
  .frame-txt{padding:12px;font-size:11px;font-weight:800;letter-spacing:.02em;line-height:1.3;color:rgba(236,232,245,.92)}
  .frame-tag{
    position:absolute;top:8px;left:8px;font-size:8px;letter-spacing:.14em;font-weight:800;
    text-transform:uppercase;color:rgba(236,232,245,.56);background:rgba(0,0,0,.42);
    padding:3px 6px;border-radius:4px;
  }
  .wall-cap{font-size:12px;color:var(--dim);margin-top:9px;line-height:1.45}
  .wall-cap b{color:var(--ink);display:block;font-size:12.5px;margin-bottom:2px;letter-spacing:.01em}

  /* ---------- facebook composer ---------- */
  .fb{
    background:#fff;color:#050505;border-radius:12px;overflow:hidden;
    border:1px solid #ccd0d5;max-width:520px;
  }
  .fb-head{display:flex;gap:10px;align-items:center;padding:13px 15px}
  .avatar{
    width:40px;height:40px;border-radius:50%;flex:none;
    background:linear-gradient(145deg,var(--cyan),#0088aa);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:14px;
  }
  .fb-name{font-size:14px;font-weight:700;line-height:1.2}
  .fb-sub{font-size:12px;color:#65676b;display:flex;align-items:center;gap:5px}
  .fb-body{padding:0 15px 13px;font-size:14px;line-height:1.5}
  .fb-img{
    aspect-ratio:1/1;
    background:
      radial-gradient(circle at 70% 26%, rgba(0,217,255,.28), transparent 55%),
      linear-gradient(150deg,#2b2338,#141019);
    display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;
  }
  .fb-img span{
    font-size:clamp(15px,3.4vw,23px);font-weight:800;line-height:1.25;letter-spacing:-.015em;
    color:#f2eee0;
  }
  .fb-bar{display:flex;border-top:1px solid #e4e6eb;font-size:13px;color:#65676b;font-weight:600}
  .fb-bar div{flex:1;text-align:center;padding:9px 0}
  .cap{
    font-size:13.5px;color:#ded7ec;white-space:pre-wrap;line-height:1.62;
    background:#161320;border:1px solid var(--line);border-radius:10px;padding:16px;
  }
  .cap .h{color:var(--cyan);font-weight:700}
  .hashtags{color:#8f86ff;word-break:break-word}

  /* ---------- spec table ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);font-weight:800}
  td:first-child{font-weight:700;white-space:nowrap}
  code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;
    background:#231d33;padding:2px 6px;border-radius:4px;color:#cbbfff;
  }
  .note{
    font-size:12.5px;color:var(--dim);border-left:2px solid var(--purple);
    padding:10px 0 10px 14px;margin-top:16px;background:rgba(109,74,255,.045);
    border-radius:0 8px 8px 0;
  }
  .warning{
    border-left-color:var(--rust);
    background:rgba(181,86,63,.045);
  }
</div>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="eyebrow">Visual Asset Kit · Module 2 (Drill Audio)</div>
    <h1>Nine Tiles, Six Icons, One <em>Bar Grid</em></h1>
    <p class="sub">
      The graphical layer for LUCIANO – SUV: a 3×3 Instagram carousel prototype mapped to bar anchors,
      an icon language for drill aesthetics, wallpaper-type frames for each platform, and a Facebook
      post scaffold. Every value is bar-derived at 140 BPM until you measure the actual downbeats.
    </p>
  </div>

  <!-- ============ 9 POST GRID ============ -->
  <h2>01 · Instagram Nine-Post Prototype</h2>
  <div class="ig-shell">
    <div>
      <div class="phone">
        <div class="phone-bar">
          <div class="dot"></div>
          <div class="phone-handle">locosquad_official</div>
          <div class="phone-meta">9 posts · grid view</div>
        </div>
        <div class="nine" id="nine"></div>
      </div>
      <div class="toggle" id="zoneToggle">
        <div class="sw"></div>
        <span>Show 1:1 safe zones &amp; crop guides</span>
      </div>
      <div class="note warning">
        All time values are bar-derived at 140 BPM. No caption track was found for this video, so
        every timestamp below is calculated, not observed. Tap the audio, find the downbeats,
        then replace the estimates with real measurements.
      </div>
    </div>
    <div class="inspector panel" id="insp"></div>
  </div>

  <!-- ============ ICONS ============ -->
  <h2>02 · Icon Set — Drill Lexicon</h2>
  <div class="icons">

    <div class="icon-card">
      <svg width="46" height="46" viewBox="0 0 46 46" fill="none" aria-hidden="true">
        <circle cx="23" cy="23" r="13" stroke="#00d9ff" stroke-width="2.5"/>
        <path d="M23 14 v18 M16 19 l14 -6" stroke="#00d9ff" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div class="icon-name" style="color:#00d9ff">Speed / Gauge</div>
      <div class="icon-use">Marks velocity, arrival, the moment before the drop. First impression anchor.</div>
      <div class="icon-sizes">24 / 48 / 96 px · stroke 2–3</div>
    </div>

    <div class="icon-card">
      <svg width="46" height="46" viewBox="0 0 46 46" fill="none" aria-hidden="true">
        <circle cx="16" cy="23" r="9" stroke="#6d4aff" stroke-width="2.5"/>
        <circle cx="30" cy="23" r="9" stroke="#6d4aff" stroke-width="2.5"/>
        <path d="M21 23 h4" stroke="#6d4aff" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div class="icon-name" style="color:#a894ff">Crew / Chain</div>
      <div class="icon-use">Two interlocked circles represent the team. The drill equivalent of the Connector.</div>
      <div class="icon-sizes">24 / 48 / 96 px · stroke 2–3</div>
    </div>

    <div class="icon-card">
      <svg width="46" height="46" viewBox="0 0 46 46" fill="none" aria-hidden="true">
        <path d="M23 10 L23 26" stroke="#b5563f" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M23 26 L13 37 M23 26 L33 37" stroke="#b5563f" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M8 14 L17 17 M38 14 L29 17" stroke="#b5563f" stroke-width="1.8" stroke-linecap="round" opacity=".55"/>
      </svg>
      <div class="icon-name" style="color:#dd9077">Tension / Split</div>
      <div class="icon-use">Names threat or opposition before resolving it. The destabilizer glyph.</div>
      <div class="icon-sizes">24 / 48 / 96 px · stroke 2–3</div>
    </div>

    <div class="icon-card">
      <svg width="46" height="46" viewBox="0 0 46 46" fill="none" aria-hidden="true">
        <circle cx="23" cy="23" r="12" stroke="#c9a227" stroke-width="2.5"/>
        <circle cx="23" cy="23" r="3.5" fill="#c9a227"/>
        <path d="M23 11 v3 M23 32 v3 M11 23 h3 M32 23 h3" stroke="#c9a227" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <div class="icon-name" style="color:#e0bf55">Stamp / Brand</div>
      <div class="icon-use">Production tag, label crest, or artist monogram. Signs the record before it starts.</div>
      <div class="icon-sizes">24 / 48 / 96 px · stroke 2–3</div>
    </div>

    <div class="icon-card">
      <svg width="46" height="46" viewBox="0 0 46 46" fill="none" aria-hidden="true">
        <rect x="14" y="8" width="18" height="30" rx="2" stroke="#5f9070" stroke-width="2.5" fill="none"/>
        <ellipse cx="23" cy="23" rx="7" ry="8" stroke="#5f9070" stroke-width="2" fill="none"/>
        <path d="M23 15 v14 M18 23 h10" stroke="#5f9070" stroke-width="1.5"/>
      </svg>
      <div class="icon-name" style="color:#8fc7a3">Timer / Count</div>
      <div class="icon-use">Maps bars to seconds. Used to calculate cut points across the 130-bar span.</div>
      <div class="icon-sizes">24 / 48 / 96 px · monochrome</div>
    </div>

    <div class="icon-card">
      <svg width="46" height="46" viewBox="0 0 46 46" fill="none" aria-hidden="true">
        <path d="M12 33 c6-16 16-22 22-24" stroke="#6d4aff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <circle cx="34" cy="9" r="2.5" fill="#6d4aff"/>
        <path d="M12 33 l-3 4 M12 33 l5 2" stroke="#6d4aff" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div class="icon-name" style="color:#a894ff">Route / City</div>
      <div class="icon-use">Traces geography — London, Berlin, Accra. Turns place into a boast.</div>
      <div class="icon-sizes">24 / 48 / 96 px · stroke 2–3</div>
    </div>

  </div>

  <!-- ============ TIMELINE ============ -->
  <h2>03 · Bar-Architecture of the Track</h2>
  <div class="panel tl-wrap">
    <div class="tl" id="tl"></div>
    <div class="ticks" id="ticks"></div>
    <div class="acts" id="acts"></div>
    <div class="note" style="min-width:640px">
      Width is proportional to bars, not seconds. The pale unaccounted band represents roughly 70 bars —
      well over half the track — where no lyrics were retrieved. Fill that gap by listening once and noting
      the section changes. The bar counter recalculates if your tempo differs from 140 BPM.
    </div>
  </div>

  <!-- ============ WALLPAPERS ============ -->
  <h2>04 · Wallpaper Types</h2>
  <div class="wall-grid">
    <div class="wall">
      <div class="frame f169">
        <div class="frame-tag">1920 × 1080</div>
        <div class="frame-txt">SUVs, ja<br>(black on black)</div>
      </div>
      <div class="wall-cap"><b>YouTube / Desktop</b>16:9. Place type in the centre 1440 × 810 — leave 240 px margins for title overlays.</div>
    </div>
    <div class="wall">
      <div class="frame f916">
        <div class="frame-tag">1080 × 1920</div>
        <div class="frame-txt">Pull up<br>in SUVs, ja</div>
      </div>
      <div class="wall-cap"><b>Story / Reel</b>9:16. Keep type in middle 1080 × 1420. Top 250 px and bottom 340 px sit under UI chrome.</div>
    </div>
    <div class="wall">
      <div class="frame f11">
        <div class="frame-tag">1080 × 1080</div>
        <div class="frame-txt">Rolls-Royce<br>SUV, ja</div>
      </div>
      <div class="wall-cap"><b>Feed post</b>1:1. Works cropped to 4:5 if you keep type centred and reduce vertical padding by 10%.</div>
    </div>
    <div class="wall">
      <div class="frame fcover">
        <div class="frame-tag">851 × 315</div>
        <div class="frame-txt">Black on black,<br>pull up in SUVs</div>
      </div>
      <div class="wall-cap"><b>Page cover</b>~2.7:1. Mobile crops to about 563 × 315 — centre the type horizontally.</div>
    </div>
  </div>

  <!-- ============ FACEBOOK ============ -->
  <h2>05 · Facebook Post Scaffold</h2>
  <div class="grid2">
    <div class="fb">
      <div class="fb-head">
        <div class="avatar">L</div>
        <div>
          <div class="fb-name">Drill Archives</div>
          <div class="fb-sub">Just now · 🌍</div>
        </div>
      </div>
      <div class="fb-body">
        "Black on black, black, pull up in SUVs."
        <br><br>
        Thirteen bars. Four repetitions. One object made absolute.
      </div>
      <div class="fb-img"><span>Pull up in SUVs, ja</span></div>
      <div class="fb-bar"><div>👍 Like</div><div>💬 Comment</div><div>↗ Share</div></div>
    </div>
    <div>
      <div class="cap"><span class="h">CAPTION DRAFT — Instagram</span>

Thirteen bars. Four repetitions. One object made absolute.

"Black on black, black, pull up in SUVs. Whole gang pull up in SUVs, ja."

The hook works by accretion — five lines circling one noun until it becomes a fact.

<span class="h">CAPTION DRAFT — Facebook</span>

Language switches mid-verse without announcement. Code-switching functions as in-group signalling — comprehension is not the point, membership is.

Full bar breakdown and unaccounted region marked in the comments.

<span class="hashtags">#DrillMusic #Luciano #SUV #Locosquad #BerlinDrill #LondonDrill #MajesticAlbum</span></div>
      <div class="note warning">
        Rights note: This is a Universal Music Group release. Fan edits are routinely claimed by content-ID systems.
        Either rely on revenue-share for claimed content, use short excerpts under critique/commentary framing,
        or obtain sync clearance from the distributor's desk before monetisation.
      </div>
    </div>
  </div>

  <!-- ============ SPECS ============ -->
  <h2>06 · Export Specification</h2>
  <table>
    <thead>
      <tr><th>Asset</th><th>Canvas</th><th>Safe area</th><th>Format</th></tr>
    </thead>
    <tbody>
      <tr><td>IG feed tile</td><td><code>1080 × 1080</code></td><td>Type inside 940 × 940</td><td>JPG q85 · sRGB</td></tr>
      <tr><td>IG portrait alt</td><td><code>1080 × 1350</code></td><td>Type inside 920 × 1190</td><td>JPG q85</td></tr>
      <tr><td>IG story / reel</td><td><code>1080 × 1920</code></td><td>Middle 1080 × 1330</td><td>PNG (type) / JPG (photo)</td></tr>
      <tr><td>FB feed image</td><td><code>1080 × 1080</code></td><td>Type inside 960 × 960</td><td>JPG q88</td></tr>
      <tr><td>FB page cover</td><td><code>851 × 315</code></td><td>Centre 620 × 260</td><td>PNG, under 100 KB target</td></tr>
      <tr><td>Icons</td><td><code>24 / 48 / 96</code></td><td>2 px padding all sides</td><td>SVG + PNG @1×/2×/4×</td></tr>
      <tr><td>Desktop wallpaper</td><td><code>1920 × 1080</code></td><td>Type clear of taskbar 60 px</td><td>PNG</td></tr>
    </tbody>
  </table>
  <div class="note">
    Colour discipline: the six icons carry fixed class colours — cyan for speed/gauge, violet for crew/chain,
    rust for tension, gold for stamp/brand — so a viewer learns the lexicon by the third tile and can read
    the remaining six at a glance. The accent palette shifts from purple-gold (Uhtred) to cyan-violet (SUV).
  </div>
  <div class="note warning">
    Temporal disclaimer: every timecode in the accompanying cut sheet is bar-derived at 140 BPM. No verified
    caption track exists for this video. Replace the estimates with measured downbeats before publishing.
  </div>

</div>

<script>
/* ---------- data: 9 blocks mapping the known structure ---------- */
const TOTAL_BARS = 130; // ≈222s at 140 BPM

// Simplified block map for the 9-tile grid
const POSTS = [
  {id:1, bars:[0,8],   role:'inc', label:'Stamp',
   title:'Producer Tag',
   pre:'Silence, then a two-second tag before the beat commits.',
   post:'Signs the record before it starts — authorship claimed early.',
   wisdom:'Announce who made it before anyone asks.'},
  {id:2, bars:[8,12],  role:'con', label:'Gauge',
   title:'Hook Drop',
   pre:'Beat enters on the noun. No ramp-up.',
   post:'Five lines circling one object — SUV. Repetition as the whole device.',
   wisdom:'Say the same thing five ways and it becomes a fact.'},
  {id:3, bars:[12,16], role:'con', label:'Gauge',
   title:'Escalade',
   pre:'Verse opens at hook energy, no dip.',
   post:'Texture before claim — colour, motion, material. Listener placed inside the car.',
   wisdom:'Establish the room before making your case in it.'},
  {id:4, bars:[16,26], role:'inc', label:'Crew',
   title:'Part 1 Body',
   pre:'Seven lines, one bar each. Build accelerates.',
   post:'Vehicle names, brand names, code-switching. The boast becomes a map.',
   wisdom:'Move the claim onto a map and it stops sounding like opinion.'},
  {id:5, bars:[26,32], role:'dis', label:'Tension',
   title:'Turkish Run',
   pre:'Language switches without announcement.',
   post:'In-group signalling. Comprehension not required, membership is.',
   wisdom:'A private language proves the circle is real.'},
  {id:6, bars:[32,40], role:'con', label:'Stamp',
   title:'Bridge',
   pre:'Beat thins. New proper nouns enter.',
   post:'Geography replaces attitude. London, Berlin, Accra named.',
   wisdom:'Trace the route and the boast becomes geography.'},
  {id:7, bars:[40,48], role:'con', label:'Gauge',
   title:'Hook 2',
   pre:'Repeat of first hook. Energy unchanged.',
   post:'Accumulation. Five lines, same object, second cycle.',
   wisdom:'The second repetition feels inevitable, not redundant.'},
  {id:8, bars:[48,56], role:'unacc', label:'Unaccounted',
   title:'Unknown Region',
   pre:'First hook cycle complete, yet 70 bars remain.',
   post:'Second verse and additional hook cycles not in retrieved listings.',
   wisdom:'Half the track still unknown. Listen once and map it.'},
  {id:9, bars:[56,130],role:'unacc', label:'Unaccounted',
   title:'The Gap',
   pre:'Bars 56 to 126 — 116 seconds unaccounted.',
   post:'Outro occupies the final 4 bars only. Everything else awaits measurement.',
   wisdom:'The work is still to do. Measure the downbeats.'}
];

function fmt(bars){
  const sec = bars * (4 * (60/140));
  const m = Math.floor(sec/60);
  const s = sec - m*60;
  return m + ':' + (s<10?'0':'') + s.toFixed(1);
}
function barRange(b){
  return 'Bar ' + b[0].toFixed(1) + '–' + b[1].toFixed(1);
}
function shortTitle(i){
  const t = POSTS[i].title.split(/\s+/);
  return t.length>2 ? t.slice(0,2).join(' ') : t[0];
}

/* ---------- build 9-post grid ---------- */
const nine = document.getElementById('nine');
let selected = 5;

POSTS.forEach(p=>{
  const el = document.createElement('div');
  el.className = 'tile' + (p.id===5 || p.id===8 ? ' hub':'');
  el.dataset.id = p.id;
  const lead = shortTitle(p.id-1);
  const extra = p.bars[1]-p.bars[0]>8 ? '<span style="opacity:.5"> +'+(Math.round(p.bars[1]-p.bars[0])-8)+'</span>' : '';
  el.innerHTML = `
    <div class="tile-num">${String(p.id).padStart(2,'0')}${extra}</div>
    <div class="tile-txt">${lead}</div>
    <div class="tile-foot">
      <span class="chip ${p.role==='inc'?'inc':p.role==='con'?'con':'dis'}">${p.label}</span>
      <span class="tile-bar">${barRange(p.bars)}</span>
    </div>
    <div class="safe-overlay"></div>`;
  el.addEventListener('click',()=>{selected=p.id;paint();});
  nine.appendChild(el);
});

/* ---------- inspector ---------- */
const insp = document.getElementById('insp');
function paint(){
  [...nine.children].forEach(c=>c.classList.toggle('sel',+c.dataset.id===selected));
  const p = POSTS[selected-1];
  const dur = (p.bars[1]-p.bars[0])*(4*(60/140));
  insp.innerHTML = `
    <div class="insp-id">Tile ${String(p.id).padStart(2,'0')} · ${p.label}</div>
    <div class="insp-line">${p.title}</div>
    <div class="kv"><b>Bar Span</b><span>${barRange(p.bars)} &nbsp;·&nbsp; ${(dur).toFixed(1)}s</span></div>
    <div class="kv"><b>Pre</b><span>${p.pre}</span></div>
    <div class="kv"><b>Post</b><span>${p.post}</span></div>
    <div class="kv"><b>Role</b><span>${p.title}</span></div>
    <div class="wis">"${p.wisdom}"</div>`;
}
paint();

/* ---------- safe zone toggle ---------- */
const tg = document.getElementById('zoneToggle');
tg.addEventListener('click',()=>{
  tg.classList.toggle('on');
  nine.classList.toggle('zones');
});

/* ---------- timeline ---------- */
const tl = document.getElementById('tl');
const SEGS = [
  {n:1, w:8,  cls:'stab', txt:'Intro'},
  {n:2, w:8,  cls:'stab', txt:'Hook 1'},
  {n:3, w:16, cls:'stab', txt:'Part 1'},
  {n:4, w:8,  cls:'stab', txt:'Bridge'},
  {n:5, w:8,  cls:'stab', txt:'Hook 2'},
  {n:6, w:8,  cls:'stab', txt:'Hook 3'},
  {n:7, w:70, cls:'unacc', txt:'Unaccounted'}
];

SEGS.forEach(s=>{
  const el = document.createElement('div');
  el.className = 'seg ' + s.cls;
  el.style.width = (s.w/TOTAL_BARS*100) + '%';
  el.title = `${s.n} · ${fmt(s.n-1)}-${fmt(s.n)} (${s.w} bars)`;
  el.innerHTML = `<em>${s.w>12?s.n:''}</em>`;
  tl.appendChild(el);
});

const ticks = document.getElementById('ticks');
[0,20,40,60,80,100,120].forEach(b=>{
  const d = document.createElement('div');
  d.className='tick'; d.style.left=(b/TOTAL_BARS*100)+'%';
  d.textContent = fmt(b).split(':')[0]+':';
  ticks.appendChild(d);
});

const acts = document.getElementById('acts');
const BLOCKS = [
  {name:'Intro', a:0, b:8},
  {name:'Hooks', a:8, b:56},
  {name:'Unaccounted', a:56, b:126},
  {name:'Outro', a:126, b:130}
];
BLOCKS.forEach(b=>{
  const d = document.createElement('div');
  d.className='act';
  d.style.width = ((b.b-b.a)/TOTAL_BARS*100)+'%';
  d.textContent = b.name + ' (' + (b.b-b.a) + ' bars)';
  acts.appendChild(d);
});
</script>
</body>
</html>
